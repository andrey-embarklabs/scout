# Per-namespace foundation (ADR 0031): sole owner of the ${scout_core_namespace}
# Namespace, shared by postgres-ready, keycloak, and valkey (all resolve to
# scout_core_namespace). Co-declaring it across their prune:true Kustomizations would
# let a mistimed prune cascade-delete the namespace, so each dependsOn this foundation.
# No shared HelmRepository here, only the Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: '${scout_core_namespace}'
  annotations:
    # Never prune the namespace: a namespace DELETION cascades to its contents
    # (PVCs -> PVs -> data). A cutover revert that drops this foundation must leave the
    # namespace and its data behind, not take them down with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
