name: Artifact generation rerun proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      artifact-attempt: ${{ github.run_attempt }}
    steps:
      - run: echo 'Freeze generation'
  build:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      a: ${{ matrix.image == 'a' && steps.upload.outputs.artifact-id || '' }}
      b: ${{ matrix.image == 'b' && steps.upload.outputs.artifact-id || '' }}
    strategy:
      fail-fast: false
      matrix:
        image: [a, b]
    env:
      GENERATION: ${{ needs.changes.outputs.artifact-attempt }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Record the generation and actual build execution
        run: |
          printf '%s:%s\n' "$GENERATION" "$GITHUB_RUN_ATTEMPT" > "$IMAGE.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: ${{ matrix.image }}-attempt-${{ github.run_attempt }}
          path: ${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Fail one initial matrix leg after its upload
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ] && [ "$IMAGE" = b ]; then exit 1; fi
  candidate:
    needs: [changes, build]
    runs-on: ubuntu-latest
    outputs:
      metadata-id: ${{ steps.metadata.outputs.artifact-id }}
      images-id: ${{ steps.images.outputs.artifact-id }}
    steps:
      - run: echo "$GITHUB_RUN_ATTEMPT" > metadata.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: metadata
        with:
          name: candidate-${{ github.run_attempt }}
          path: metadata.txt
          if-no-files-found: error
          retention-days: 1
      - name: Fail after metadata upload on the first candidate execution
        run: test "$GITHUB_RUN_ATTEMPT" -ne 2
      - run: echo "$GITHUB_RUN_ATTEMPT" > images.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: images
        with:
          name: images-${{ github.run_attempt }}
          path: images.txt
          if-no-files-found: error
          retention-days: 1
  consumer:
    needs: [changes, build, candidate]
    runs-on: ubuntu-latest
    outputs:
      tested-generation: ${{ needs.changes.outputs.artifact-attempt }}
    env:
      GENERATION: ${{ needs.changes.outputs.artifact-attempt }}
    steps:
      - id: builds
        env:
          ARTIFACTS: ${{ toJSON(needs.build.outputs) }}
        run: echo "ids=$(jq -er '[.[] | select(. != "") | tonumber] | join(",")' <<< "$ARTIFACTS")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.builds.outputs.ids }}
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.candidate.outputs.metadata-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.candidate.outputs.images-id }}
      - name: Check the original bytes and fail the first consumer execution
        run: |
          printf 'generation=%s a=%s b=%s metadata=%s images=%s\n' "$GENERATION" "$(cat a.txt)" "$(cat b.txt)" "$(cat metadata.txt)" "$(cat images.txt)"
          if [ "$GITHUB_RUN_ATTEMPT" -lt 6 ]; then
            test "$GENERATION" = 1
            test "$(cat a.txt)" = '1:1'
            test "$(cat b.txt)" = '1:2'
          else
            test "$GENERATION" = 6
            test "$(cat a.txt)" = '6:6'
            test "$(cat b.txt)" = '6:6'
          fi
          test "$(cat metadata.txt)" = "$(cat images.txt)"
          if [ "$GITHUB_RUN_ATTEMPT" -lt 6 ]; then test "$(cat metadata.txt)" = 3; fi
          if [ "$GITHUB_RUN_ATTEMPT" = 6 ]; then test "$(cat metadata.txt)" = 6; fi
          if [ "$GITHUB_RUN_ATTEMPT" = 3 ]; then echo 'Intentional failure after all artifact checks passed'; exit 1; fi
  unrelated:
    runs-on: ubuntu-latest
    steps:
      - run: test "$GITHUB_RUN_ATTEMPT" -gt 4
  record:
    needs: [changes, build, candidate, consumer, unrelated]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      GENERATION: ${{ needs.changes.outputs.artifact-attempt }}
      TESTED: ${{ needs.consumer.outputs.tested-generation }}
    steps:
      - name: Check retained outputs and record the successful execution
        run: |
          test -n "$GENERATION"
          test "$GENERATION" = "$TESTED"
          if [ "$GITHUB_RUN_ATTEMPT" = 5 ]; then test "$GENERATION" = 1; fi
          if [ "$GITHUB_RUN_ATTEMPT" = 6 ]; then test "$GENERATION" = 6; fi
          printf 'generation=%s\nexecution=%s\n' "$GENERATION" "$GITHUB_RUN_ATTEMPT" > receipt.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: receipt-${{ github.run_attempt }}
          path: receipt.txt
          if-no-files-found: error
          retention-days: 1
